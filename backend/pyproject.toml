[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heatsafe-backend"
version = "0.1.0"
description = "Deterministic risk engine and API for HeatSafe 2030"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "pydantic>=2.6,<3",
  "numpy>=1.26,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
m1 = [
  "httpx>=0.27,<1",
  "pandas>=2.2,<3",
  "pyarrow>=16,<24",
  "pyproj>=3.6,<4",
  "shapely>=2,<3",
]
m2 = [
  "httpx>=0.27,<1",
  "pandas>=2.2,<3",
  "pyarrow>=16,<24",
  "planetary-computer>=1.0,<2",
  "pystac-client>=0.8,<1",
  "pyproj>=3.6,<4",
  "rasterio>=1.3,<2",
  "shapely>=2,<3",
]
m3b = [
  "cdsapi>=0.7.7,<1",
  "h5py>=3.11,<4",
  "h5netcdf>=1.3,<2",
  "pandas>=2.2,<3",
  "pyarrow>=16,<24",
  "xarray>=2024.1",
]
geo = [
  "duckdb>=1,<2",
  "geopandas>=1,<2",
  "pandas>=2.2,<3",
  "pyarrow>=16,<20",
  "pyproj>=3.6,<4",
  "rasterio>=1.3,<2",
  "rioxarray>=0.15,<1",
  "shapely>=2,<3",
  "xarray>=2024.1",
]
test = ["httpx>=0.27,<1", "pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q -m 'not live_worldpop and not live_landsat and not live_sentinel2 and not live_era5'"
markers = [
  "live_worldpop: calls the real WorldPop API and is excluded from normal pytest runs",
  "live_landsat: calls the Planetary Computer STAC/COG services and is excluded from normal pytest runs",
  "live_sentinel2: calls the Planetary Computer Sentinel-2 STAC/COG services and is excluded from normal pytest runs",
  "live_era5: calls the Copernicus Climate Data Store and is excluded from normal pytest runs",
]
